name: ConsRiskyAsset

symbols:
  spaces:
    Xk: "@def R+"
    Xp: "@def R++"
    Xm: "@def R+"
    Xw: "@def R+"
    Xa: "@def R+"
    Pi: "@def [0,1]"

  prestate:
    k: "@in Xk"
    p_prev: "@in Xp"

  exogenous:
    psi:
      - "@in R++"
      - "@dist LogNormal(0, sigma_psi)"
    xi:
      - "@in R+"
      - "@dist LogNormal(0, sigma_xi)"
    Risky:
      - "@in R++"
      - "@dist LogNormal(mu_Risky, sigma_Risky)"

  states:
    m: "@in Xm"
    p: "@in Xp"

  controls:
    c: "@in R+"
    varsigma: "@in Pi"

  poststates:
    a: "@in Xa"
    p_nxt: "@in Xp"

  values:
    V[<]: "@in R"
    V: "@in R"
    V[>]: "@in R"

  values_marginal:
    dV[<]: "@in R+"
    dV: "@in R+"
    dV[>]: "@in R+"

  parameters:
    beta: "@in (0,1)"
    rho: "@in R+"
    Rfree: "@in R++"
    PermGroFac: "@in R++"
    LivPrb: "@in [0,1]"
    sigma_psi: "@in R+"
    sigma_xi: "@in R+"
    mu_Risky: "@in R"
    sigma_Risky: "@in R+"

equations:
  arvl_to_dcsn_transition: |
    G = PermGroFac * psi
    p = p_prev * G
    b = k / G
    y = xi
    m = b + y

  dcsn_to_cntn_transition: |
    w = m - c
    Rport = Rfree + (Risky - Rfree) * varsigma
    a = Rport * w
    p_nxt[>] = p

  cntn_to_dcsn_builder:
    Bellman: |
      u = (c^(1-rho))/(1-rho)
      V = max_{c, varsigma}(u + beta * LivPrb * V[>])
    InvEuler: |
      c = (beta * LivPrb * dV[>])^(-1/rho)
    OptimalShare: |
      varsigma = argmax_{varsigma}(E_{Risky}(V[>]))
    MarginalBellman: |
      dV = c^(-rho)

  dcsn_to_arvl_builder:
    Bellman: |
      V[<] = E_{psi, xi}(G^(1-rho) * V)
    ShadowBellman: |
      dV[<] = E_{psi, xi}(G^(-rho) * dV)

calibration:
  beta: 0.96
  rho: 2.0
  Rfree: 1.03
  PermGroFac: 1.01
  LivPrb: 0.98
  sigma_psi: 0.1
  sigma_xi: 0.1
  mu_Risky: 0.04
  sigma_Risky: 0.15
