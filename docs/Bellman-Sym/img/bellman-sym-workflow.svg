<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" font-family="Inter, Helvetica, Arial, sans-serif">
  <!-- Adapted on 12 September 2026 from the figure compiled-code.svg of the Rosetta-stone presentation of 10 June 2026, an internal asset
       (the Rosetta-stone deck of 10 June 2026). Redrawn as one sequence at AAS's direction: specification
       transforms the semantic graph rather than entering beside it. -->
  <defs>
    <marker id="ccarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>

  <!-- 1 stage files (syntax) -->
  <rect x="30" y="90" width="235" height="130" rx="12" fill="#ffffff" stroke="#00aeef" stroke-width="2.5"/>
  <text x="147.5" y="128" fill="#00aeef" font-size="20" font-weight="700" text-anchor="middle">stage files</text>
  <text x="147.5" y="156" fill="#212529" font-size="15" text-anchor="middle">syntax only: a .bl file</text>
  <text x="147.5" y="177" fill="#212529" font-size="15" text-anchor="middle">per stage, YAML for periods,</text>
  <text x="147.5" y="198" fill="#212529" font-size="15" text-anchor="middle">trellis and numerical choices</text>

  <!-- elaborate -->
  <line x1="269" y1="155" x2="331" y2="155" stroke="#495057" stroke-width="2.2" marker-end="url(#ccarrow)"/>
  <text x="300" y="140" fill="#676470" font-size="14.5" text-anchor="middle">elaborate</text>

  <!-- 2 semantic graph -->
  <rect x="335" y="90" width="235" height="130" rx="12" fill="#ffffff" stroke="#1f476b" stroke-width="2.5"/>
  <text x="452.5" y="128" fill="#1f476b" font-size="20" font-weight="700" text-anchor="middle">semantic graph</text>
  <text x="452.5" y="156" fill="#212529" font-size="15" text-anchor="middle">every operator of the model</text>
  <text x="452.5" y="177" fill="#212529" font-size="15" text-anchor="middle">a typed box on typed wires;</text>
  <text x="452.5" y="198" fill="#212529" font-size="15" text-anchor="middle">no numbers yet</text>

  <!-- specify -->
  <line x1="574" y1="155" x2="636" y2="155" stroke="#495057" stroke-width="2.2" marker-end="url(#ccarrow)"/>
  <text x="605" y="140" fill="#676470" font-size="14.5" text-anchor="middle">specify</text>

  <!-- 3 specified graph -->
  <rect x="640" y="90" width="235" height="130" rx="12" fill="#ffffff" stroke="#f05a28" stroke-width="2.5"/>
  <text x="757.5" y="128" fill="#f05a28" font-size="20" font-weight="700" text-anchor="middle">specified graph</text>
  <text x="757.5" y="156" fill="#212529" font-size="15" text-anchor="middle">the same boxes and wires,</text>
  <text x="757.5" y="177" fill="#212529" font-size="15" text-anchor="middle">a method, settings and</text>
  <text x="757.5" y="198" fill="#212529" font-size="15" text-anchor="middle">parameter values attached</text>

  <!-- realise -->
  <line x1="879" y1="155" x2="941" y2="155" stroke="#495057" stroke-width="2.2" marker-end="url(#ccarrow)"/>
  <text x="910" y="140" fill="#676470" font-size="14.5" text-anchor="middle">realise</text>

  <!-- 4 numerical routine -->
  <rect x="945" y="90" width="235" height="130" rx="12" fill="#f8f9fa" stroke="#39b54a" stroke-width="2.5"/>
  <text x="1062.5" y="128" fill="#39b54a" font-size="20" font-weight="700" text-anchor="middle">numerical routine</text>
  <text x="1062.5" y="156" fill="#212529" font-size="15" text-anchor="middle">one per operator, from a</text>
  <text x="1062.5" y="177" fill="#212529" font-size="15" text-anchor="middle">toolkit or written by hand;</text>
  <text x="1062.5" y="198" fill="#212529" font-size="15" text-anchor="middle">outside the language</text>

  <!-- caption -->
  <text x="605" y="290" fill="#212529" font-size="17.5" text-anchor="middle" font-weight="600">Each step transforms the object before it; the routine is built from the specified graph, never from the syntax directly.</text>
</svg>
