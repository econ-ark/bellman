{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
{% endblock %}

{% block header %}
  {% include "partials/parent-bar.html" %}
  {{ super() }}
{% endblock %}

{% block scripts %}
  {{ super() }}
  {% if page and 'class="arithmatex"' in page.content %}
    <script src="{{ '_javascripts/mathjax.js' | url }}"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
  {% endif %}
{% endblock %}
