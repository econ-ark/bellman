name: ConsPerfForesight

symbols:
  spaces:
    Xk: "@def R+"
    Xp: "@def R++"
    Xm: "@def R+"
    Xa: "@def R+"

  prestate:
    k: "@in Xk"
    p_prev: "@in Xp"

  states:
    m: "@in Xm"
    p: "@in Xp"

  poststates:
    a: "@in Xa"

  controls:
    c: "@in R+"

  exogenous:
    live:
      - "@in {0,1}"
      - "@dist Bernoulli(LivPrb)"

  values:
    V[<]: "@in R"
    V: "@in R"
    V[>]: "@in R"

  values_marginal:
    dV[<]: "@in R+"
    dV: "@in R+"
    dV[>]: "@in R+"

  parameters:
    beta: "@in (0,1)"
    rho: "@in R+"
    Rfree: "@in R++"
    PermGroFac: "@in R++"
    LivPrb: "@in (0,1]"

equations:
  arvl_to_dcsn_transition: |
    p = p_prev * PermGroFac
    b = Rfree * k / PermGroFac
    y = 1.0
    m = b + y

  dcsn_to_cntn_transition: |
    a = m - c

  cntn_to_dcsn_builder:
    Bellman: |
      u = c^(1-rho) / (1-rho)
      V = max_c{u + beta * LivPrb * V[>]}
    InvEuler: |
      c = (beta * LivPrb * dV[>])^(-1/rho)
    MarginalBellman: |
      dV = c^(-rho)
    cntn_to_dcsn_transition: |
      m[>] = Rfree * a / PermGroFac + 1.0

  dcsn_to_arvl_builder:
    Bellman: |
      V[<] = V
    ShadowBellman: |
      dV[<] = dV

calibration:
  parameters:
    beta: 0.96
    rho: 2.0
    Rfree: 1.03
    PermGroFac: 1.01
    LivPrb: 0.98
