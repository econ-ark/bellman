name: ConsPerfForesight_simple

symbols:
  spaces:
    Xk: "@def R+"
    Xp: "@def R++"
    Xm: "@def R+"
    Xa: "@def R+"

  prestate:
    k: "@in Xk"
    p_prev: "@in Xp"

  exogenous:
    zeta:
      - "@in {0,1}"
      - "@dist Bernoulli(LivPrb)"

  states:
    m: "@in Xm"
    p: "@in Xp"

  poststates:
    a: "@in Xa"

  controls:
    c: "@in R+"

  values:
    V[<]: "@in R"
    V: "@in R"
    V[>]: "@in R"

  parameters:
    Rfree: "@in R++"
    PermGroFac: "@in R++"
    LivPrb: "@in (0,1]"
    rho: "@in R+"
    beta: "@in (0,1)"

equations:
  arvl_to_dcsn_transition: |
    y = 1.0
    p = p_prev * PermGroFac
    b = Rfree * k / PermGroFac
    m = b + y

  dcsn_to_cntn_transition: |
    a = m - c

  cntn_to_dcsn_builder:
    Bellman: |
      u = (c^(1-rho))/(1-rho)
      V = max_{c}(u + beta * LivPrb * V[>])
    
  dcsn_to_arvl_builder:
    Bellman: |
      V[<] = V
    Transition: |
      k = zeta * a
      p_prev = p

calibration:
  parameters:
    Rfree: 1.03
    PermGroFac: 1.01
    LivPrb: 0.98
    rho: 2.0
    beta: 0.96
