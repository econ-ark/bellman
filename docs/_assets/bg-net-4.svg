    <circle cx="540" cy="95" r="10" opacity="0.03"/>
  </g>

  <!-- Branch nodes (faint) -->
  <circle cx="620"  cy="330" r="2.5" fill="#1a1a1a" opacity="0.04"/>
  <circle cx="850"  cy="380" r="2.5" fill="#1a1a1a" opacity="0.04"/>
  <circle cx="1050" cy="360" r="2.5" fill="#1a1a1a" opacity="0.04"/>

  <!-- ═══ Highlighted node: 320,185 (arrival — leftmost) ═══ -->
  <circle cx="320" cy="185" r="4.5" fill="#1a1a1a" opacity="0.13"/>
  <g fill="none" stroke="#1a1a1a" stroke-width="0.6"
