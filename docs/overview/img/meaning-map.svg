      .bf-op { fill: var(--bf-face, #ffffff); stroke: var(--bf-ink, #1f476b); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
      .bf-arvl { fill: var(--bf-arvl, #39b54a); }
