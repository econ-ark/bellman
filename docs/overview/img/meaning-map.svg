<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 900 252" width="900" style="max-width:100%;height:auto;overflow:visible" role="img" aria-labelledby="fig-meaning-map" aria-describedby="mm-desc">
  <!-- Drawn 19 September 2026 for docs/overview/01-concepts.md by make_meaning_map.py, along the lines of slide 14 of the CEF interoperability talk, in the vocabulary of the modularity figure. Econ-ARK palette by role: navy for structure and for the letters Upsilon and Rho, pink for the AI assistant, the home page's perch hues (arrival green, decision orange, continuation cyan). Colours are CSS variables set in docs/_stylesheets/extra.css; the fallbacks here are the light scheme. -->
  <desc id="mm-desc">Drawn in the axonometric manner of the modularity figure. At the left, you, drawn as the Adam Smith avatar; you write the stage files, a pile of sheets. Elaboration, the meaning map Upsilon, turns them into the semantic graph, a platform carrying the stage's two operators as boxes on a wire between its three perches, inside a region marked as the meaning, the model stated in full. The graph's denotations give the formal mathematics, a sheet above the files with the Bellman equation and the law of motion on it, which you read back. Compiled by Rho, on whose arrow the AI sits, inside a band marked outside Bellman-SYM, it gives code, a fan of three tiles named HARK, Dolo and QuantEcon.</desc>
