site_name: Project Bellman
site_description: Build rich, dynamic heterogeneous agent models from reusable stages—in a language both humans and AI can understand.
site_url: https://econ-ark.github.io/bellman/

repo_name: econ-ark/bellman
repo_url: https://github.com/econ-ark/bellman

docs_dir: docs
site_dir: site

# Files matching these globs are excluded from the build. Used here for
# snippet partials (files prefixed with "_") that are pulled in via
# pymdownx.snippets and should not render as standalone pages.
exclude_docs: |
  _*.md
  # The site's hooks and the page printer: Python that the build and the tests
  # run, which MkDocs would otherwise copy into the built site.
  /_hooks/
  # Theme templates are read through custom_dir, not published as raw HTML.
  /_overrides/
  # The canonical fields chapter is 04-fields, functions and types.md.
  bellman-calculus/04-fields-functions-and-types--WIP-revision.md
  # Folders named old: `**/old/` of .gitignore keeps them out of git, so they
  # stand only in a checkout that holds them as leftovers and never in a clone.
  # Excluded so that the strict build of such a checkout reports the warnings
  # of a clone's.
  **/old/

theme:
  name: material
  palette:
    - scheme: bellman
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false
  logo: _assets/brand/logo.svg
  favicon: _assets/brand/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path        # breadcrumb trail at the top of each page (the "where am I" cue)
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow
  custom_dir: docs/_overrides

plugins:
  - search
  - callouts  # Converts Obsidian-style callouts to MkDocs admonitions
  - roamlinks  # Converts Obsidian [[wikilinks]] to relative links (rosetta-stone wiki)
  # - obsidian-support  # Converts Obsidian tags, wikilinks, etc. (needs pip install)
  - toggle-sidebar:
      toggle_button: all
      show_navigation_by_default: true
      show_toc_by_default: true
      theme: auto
  - tags

# Build-time hooks (no extra pip dependency required), kept in docs/_hooks/.
hooks:
  - docs/_hooks/obsidian_tags.py  # render standalone Obsidian #tag lines as chips (not <h1>)
  - docs/_hooks/homepage.py       # the custom homepage uses CSS animations and no docs controls

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.saneheaders   # require a space after '#': Obsidian #tags never become headings
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - footnotes

extra_css:
  # Query string is a cache-buster; bump when CSS changes substantially.
  - _stylesheets/extra.css?v=20260930a
  - _stylesheets/rosetta.css?v=20260622q   # Rosetta Stone registry "Lexicon" styling
  - _stylesheets/bellman.css?v=20261031a

extra_javascript:
  - _javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - _javascripts/meaning_map.js
  - _javascripts/figure_sequences.js   # the figures' assembly sequences wait until the figure is on screen
  - _javascripts/rosetta-card-nav.js   # keep the left nav visible + highlighted on Rosetta card pages

