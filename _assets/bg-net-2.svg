<?xml version="1.0" encoding="UTF-8"?>
<!--
  Network progression 2/4 — backward nest traversal.
  Previous node (1150) fades to mid-opacity; new active node at 950.
  The edge between them is brighter.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480"
  preserveAspectRatio="xMidYMid slice">

  <!-- ═══ Ambient network ═══ -->
  <g stroke="#1a1a1a" stroke-width="0.6" fill="none" opacity="0.04">
    <line x1="95"  y1="110" x2="320" y2="185"/>
    <line x1="320" y1="185" x2="540" y2="95"/>
    <line x1="540" y1="95"  x2="720" y2="210"/>
    <line x1="720" y1="210" x2="950" y2="140"/>
    <line x1="1150" y1="240" x2="1320" y2="130"/>
    <line x1="320" y1="185" x2="260" y2="360"/>
    <line x1="540" y1="95"  x2="620" y2="330"/>
    <line x1="720" y1="210" x2="850" y2="380"/>
    <line x1="950" y1="140" x2="1050" y2="360"/>
    <line x1="260" y1="360" x2="620" y2="330"/>
    <line x1="620" y1="330" x2="850" y2="380"/>
    <line x1="850" y1="380" x2="1050" y2="360"/>
    <line x1="95"  y1="110" x2="60"  y2="290"/>
    <line x1="1320" y1="130" x2="1360" y2="320"/>
  </g>

  <g fill="#1a1a1a" opacity="0.05">
    <circle cx="95"   cy="110" r="3"/>
    <circle cx="320"  cy="185" r="3"/>
    <circle cx="540"  cy="95"  r="3"/>
    <circle cx="720"  cy="210" r="3"/>
    <circle cx="1320" cy="130" r="3"/>
    <circle cx="260"  cy="360" r="3"/>
    <circle cx="620"  cy="330" r="3"/>
    <circle cx="850"  cy="380" r="3"/>
    <circle cx="1050" cy="360" r="3"/>
    <circle cx="60"   cy="290" r="2.5"/>
    <circle cx="1360" cy="320" r="2.5"/>
  </g>

  <!-- ═══ Traversed edge: 950→1150 (brighter) ═══ -->
  <line x1="950" y1="140" x2="1150" y2="240"
    stroke="#1a1a1a" stroke-width="0.7" opacity="0.08"/>

  <!-- Previous node: 1150 (faded from highlight) -->
  <circle cx="1150" cy="240" r="3.5" fill="#1a1a1a" opacity="0.08"/>
  <g fill="none" stroke="#1a1a1a" stroke-width="0.5"
     stroke-dasharray="3 2" stroke-linecap="round">
    <circle cx="1150" cy="240" r="10" opacity="0.04"/>
    <circle cx="1150" cy="240" r="17" opacity="0.025"/>
  </g>

  <!-- ═══ Highlighted node: 950,140 (active) ═══ -->
  <circle cx="950" cy="140" r="4" fill="#1a1a1a" opacity="0.12"/>
  <g fill="none" stroke="#1a1a1a" stroke-width="0.6"
     stroke-dasharray="3 2" stroke-linecap="round">
    <circle cx="950" cy="140" r="11" opacity="0.09"/>
    <circle cx="950" cy="140" r="19" opacity="0.06"/>
    <circle cx="950" cy="140" r="28" opacity="0.035"/>
  </g>
</svg>
