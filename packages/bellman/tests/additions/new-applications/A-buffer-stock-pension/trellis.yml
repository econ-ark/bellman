!trellis
name: buffer_stock_pension
# periods[0] is the last working period, bound by value function iteration;
# the five earlier periods by the endogenous grid method. One stage file at
# every occurrence; the additions differ by occurrence and are read in the
# order given, the stage file the left unit of the union (specification 0.7
# §4, D3); the structural addition, the pension account, is read at every
# occurrence (F42), so that the connector `{a: k, q: p}` joins fields both
# sides declare.
periods:
  - stages:
      buffer_stock: {stage: stage/buffer_stock.bl, label: last_working,
                     methods: [additions/pension.bl, additions/vfi.bl]}
  - stages:
      buffer_stock: {stage: stage/buffer_stock.bl,
                     methods: [additions/pension.bl, additions/egm.bl]}
    repeat: 5
# Savings become next period's assets and the carried balance next period's
# balance; the terminal boundary data V[>] of periods[0] is a function of (a, q).
inter_connectors:
  - {a: k, q: p}
