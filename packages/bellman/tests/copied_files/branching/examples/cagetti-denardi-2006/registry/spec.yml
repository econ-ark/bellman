# The recipe of the Cagetti and De Nardi (2006) model: the trellis file and
# each stage's file, by their paths from this folder, and for each stage and
# each kind the ordered sources; `$fill` is bound by keyword of `load_recipe`.
# Each stage names a methods file of its own, so that a method choice reaches
# one stage. The prices w, τ and p, which the stationary equilibrium sets and
# the paper does not report, enter through `$fill`. The four terminal stages
# declare no parameter and carry no method; they are active in the terminal
# period alone, `periods: [0, 0]`.
trellis: trellis.yml
stages:
  worker_ageing:       {stage: stages/worker_ageing.bl,       calibration: {all: [calibration/cagetti_denardi, $fill]}, settings: {all: [settings/cagetti_denardi, $fill]}, methods: {all: [methods/worker_ageing.bl]}}
  entrepreneur_ageing: {stage: stages/entrepreneur_ageing.bl, calibration: {all: [calibration/cagetti_denardi, $fill]}, settings: {all: [settings/cagetti_denardi, $fill]}, methods: {all: [methods/entrepreneur_ageing.bl]}}
  entrepreneur_death:  {stage: stages/entrepreneur_death.bl,  calibration: {all: [calibration/cagetti_denardi, $fill]}, settings: {all: [settings/cagetti_denardi, $fill]}, methods: {all: [methods/entrepreneur_death.bl]}}
  retiree_death:       {stage: stages/retiree_death.bl,       calibration: {all: [calibration/cagetti_denardi, $fill]}, settings: {all: [settings/cagetti_denardi, $fill]}, methods: {all: [methods/retiree_death.bl]}}
  young_choice:        {stage: stages/young_choice.bl,        calibration: {all: [calibration/cagetti_denardi, $fill]}, settings: {all: [settings/cagetti_denardi, $fill]}, methods: {all: [methods/young_choice.bl]}}
  old_choice:          {stage: stages/old_choice.bl,          calibration: {all: [calibration/cagetti_denardi, $fill]}, settings: {all: [settings/cagetti_denardi, $fill]}, methods: {all: [methods/old_choice.bl]}}
  young_entrepreneur:  {stage: stages/young_entrepreneur.bl,  calibration: {all: [calibration/cagetti_denardi, $fill]}, settings: {all: [settings/cagetti_denardi, $fill]}, methods: {all: [methods/young_entrepreneur.bl]}}
  old_entrepreneur:    {stage: stages/old_entrepreneur.bl,    calibration: {all: [calibration/cagetti_denardi, $fill]}, settings: {all: [settings/cagetti_denardi, $fill]}, methods: {all: [methods/old_entrepreneur.bl]}}
  worker:              {stage: stages/worker.bl,              calibration: {all: [calibration/cagetti_denardi, $fill]}, settings: {all: [settings/cagetti_denardi, $fill]}, methods: {all: [methods/worker.bl]}}
  retiree:             {stage: stages/retiree.bl,             calibration: {all: [calibration/cagetti_denardi, $fill]}, settings: {all: [settings/cagetti_denardi, $fill]}, methods: {all: [methods/retiree.bl]}}
  terminal_worker:             {stage: stages/terminal_worker.bl,             periods: [0, 0]}
  terminal_young_entrepreneur: {stage: stages/terminal_young_entrepreneur.bl, periods: [0, 0]}
  terminal_old_entrepreneur:   {stage: stages/terminal_old_entrepreneur.bl,   periods: [0, 0]}
  terminal_retiree:            {stage: stages/terminal_retiree.bl,            periods: [0, 0]}
registry:
  calibration: [calibration/corporate_sector]
