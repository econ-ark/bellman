stage: bequest_pa

# The bequest's value and its marginal value read by linear interpolation in
# the bequest base, the basis !Linear, on the grid the setting grid names by
# its kind, !Cartesian, with its order and bounds beside it; forward, the base
# is formed deterministically.
methods:
  - on: cntn_to_dcsn.evaluate.value
    method: !Linear
    settings: {grid: !Cartesian, orders: {B: n_B}, bounds: {B: [B_min, B_max]}}
  - on: cntn_to_dcsn.evaluate.marginal
    method: !Linear
    settings: {grid: !Cartesian, orders: {B: n_B}, bounds: {B: [B_min, B_max]}}
  - on: arvl_to_dcsn
    method: !deterministic
