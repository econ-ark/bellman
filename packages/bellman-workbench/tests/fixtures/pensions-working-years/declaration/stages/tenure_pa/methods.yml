stage: tenure_pa

# The comparison of the three branch values, renting, adjusting and keeping;
# the branch values are read by linear interpolation, the basis !Linear, on
# the grid of cash on hand the setting grid names by its kind, !Cartesian,
# with its order and bounds beside it; forward, the policy splits the
# households among the three branches.
methods:
  - on: policy
    method: !max
  - on: cntn_to_dcsn.evaluate.value
    method: !Linear
    settings: {grid: !Cartesian, orders: {w_d: n_w}, bounds: {w_d: [w_min, w_max]}}
  - on: dcsn_to_cntn
    method: !monte-carlo
    settings:
      n_paths: 10000
      seed: 42
  - on: arvl_to_dcsn
    method: !deterministic
