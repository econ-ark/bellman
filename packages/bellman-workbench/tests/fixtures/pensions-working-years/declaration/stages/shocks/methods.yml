stage: shocks

# Numerical choices for shocks.bl. The one expectation integrates the five
# draws of the period: the wage innovation and the two return shocks are
# normal, the taste and the discount factor are Markov chains. The paper takes
# a five-state chain for the wage (Kopecky and Suen 2010), two points for the
# return shock and three for the price shock (Appendix D.1).
methods:
  - on: E_u_ε_d_ε_h_α_β
    method: !gauss-hermite
    settings:
      n_nodes: [5, 2, 3, 3, 3]
  - on: arvl_to_dcsn
    method: !monte-carlo
    settings:
      n_paths: 10000
      seed: 42
  - on: dcsn_to_cntn
    method: !deterministic
