stage: renter_cons

# Numerical choices for renter_cons.bl: root finding at the maximization, as
# Appendix D.2 of Dobrescu et al. (2023) solves the renter; linear
# interpolation of the value and the marginal value of cash on the grid of
# settings/renter_cons.yml; the forward identity and savings deterministic.
methods:
  - on: policy.optimality.argmax
    method: !root-find
  - on: cntn_to_dcsn.value
    method: !Linear
    settings:
      orders: {w_d: n_w}
      bounds: {w_d: [w_min, w_max]}
  - on: cntn_to_dcsn.marginal_cash
    method: !Linear
    settings:
      orders: {w_d: n_w}
      bounds: {w_d: [w_min, w_max]}
  - on: arvl_to_dcsn
    method: !deterministic
  - on: dcsn_to_cntn
    method: !deterministic
