stage: renter_cons

# Numerical choices for renter_cons.bl: root finding at the maximization, as
# Appendix D.2 of Dobrescu et al. (2023) solves the renter; linear
# interpolation, the basis !Linear, of the value and the marginal value of
# cash on the grid of settings/renter_cons.yml, which the setting grid names
# by its kind, !Cartesian, with its order and bounds beside it; the forward
# identity and savings deterministic.
methods:
  - on: policy.optimality.argmax
    method: !root-find
  - on: cntn_to_dcsn.evaluate.value
    method: !Linear
    settings:
      grid: !Cartesian
      orders: {w_d: n_w}
      bounds: {w_d: [w_min, w_max]}
  - on: cntn_to_dcsn.evaluate.marginal
    method: !Linear
    settings:
      grid: !Cartesian
      orders: {w_d: n_w}
      bounds: {w_d: [w_min, w_max]}
  - on: arvl_to_dcsn
    method: !deterministic
  - on: dcsn_to_cntn
    method: !deterministic
