# The recipe of the pension model of Dobrescu et al. (2023), a second route of
# this folder, at its first construction: the trellis file and each stage's
# file, by their paths from this folder, and for each stage its calibration and
# settings as slots bound by keyword of `load_recipe`; no stage names an
# addition yet, so its methods list is empty.
trellis: trellis.pensions.yml
stages:
  shocks: {stage: stages/shocks/shocks.bl, calibration: {all: [calibration/pension_age_profiles, $shocks_calibration]}, settings: {all: [$shocks_settings]}, methods: {all: []}}
  survival: {stage: stages/survival/survival.bl, calibration: {all: [calibration/pension_age_profiles, $survival_calibration]}, settings: {all: [$survival_settings]}, methods: {all: []}}
  tenure_pa: {stage: stages/tenure_pa/tenure_pa.bl, calibration: {all: [$tenure_pa_calibration]}, settings: {all: [$tenure_pa_settings]}, methods: {all: []}}
  renter_cons: {stage: stages/renter_cons/renter_cons.bl, calibration: {all: [$renter_cons_calibration]}, settings: {all: [$renter_cons_settings]}, methods: {all: []}}
  keeper_cons_pa: {stage: stages/keeper_cons_pa/keeper_cons_pa.bl, calibration: {all: [$keeper_cons_pa_calibration]}, settings: {all: [$keeper_cons_pa_settings]}, methods: {all: []}}
  adjuster_cons_pa: {stage: stages/adjuster_cons_pa/adjuster_cons_pa.bl, calibration: {all: [$adjuster_cons_pa_calibration]}, settings: {all: [$adjuster_cons_pa_settings]}, methods: {all: []}}
  bequest_pa: {stage: stages/bequest_pa/bequest_pa.bl, calibration: {all: [$bequest_pa_calibration]}, settings: {all: [$bequest_pa_settings]}, methods: {all: []}}
