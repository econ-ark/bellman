[pytest]
# The project's own tests. A bare `pytest` from the repository root would also
# walk the internal folder `AI`, and any reference clone kept there brings its
# own suite: in September 2026 the two DisCoPy clones kept there stopped
# collection on 111 import errors for packages this project does not install,
# so none of the project's tests ran. Those clones have moved out of the
# repository; testpaths and norecursedirs keep the next one from doing the same.
# The Workbench tests, which drive the live application in a browser and its
# shell, are left out of the default run for now (AAS, 15 October 2026);
# `pytest packages/bellman-workbench/tests` runs them.
testpaths = tests packages/bellman packages/asva/tests applications tutorials
norecursedirs = venv .git node_modules site *.egg-info __pycache__ .pytest_cache

# Only files named test_*.py are test modules. The default of pytest also matches
# *_test.py, which would collect packages/asva/asva/run/make_test.py, a module of
# the runner that holds no tests.
python_files = test_*.py

# A test marked `sweep` is part of a sweep over the corpus stages, the refusal
# catalogue or a whole trellis. packages/bellman/tests/conftest.py leaves the
# sweeps out of a run given no marker expression, so that the fast core is the
# default selection, and `-m sweep` runs them.
markers =
    sweep: part of a sweep over the corpus stages, the refusal catalogue or a whole trellis; left out of a run given no marker expression, run by -m sweep
