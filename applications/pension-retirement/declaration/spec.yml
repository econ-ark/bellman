# The recipe of the pension model: the trellis file and each stage's file, by
# their paths from this folder, and for each stage and each kind the ordered
# sources. The model has no calibration file: economics.md states that none is
# written until the values are supplied, so the calibration list of each stage
# that declares parameters holds the slot `$fill` alone, which the values fill
# by keyword of load_recipe or assemble_trellis. Each stage's methods file is
# the addition beside its stage file, stages/<key>/methods.bl, which writes the
# first-order conditions of the two saving stages with the method that solves
# them, their decision grids, and the derivative lines of every value; a change
# of selection would be another addition named in its place. The two saving
# stages read the settings of their decision grids from settings/<key>.yml.
# retire_choice declares no parameter and reads no setting. The terminal
# stage declares none and reads none, its methods file writes its zero
# derivatives, and it is active in the terminal period alone, periods: [0, 0].
trellis: trellis.yml
stages:
  worker_saving:  {stage: stages/worker_saving/worker_saving.bl,   calibration: {all: [$fill]}, settings: {all: [settings/worker_saving]}, methods: {all: [stages/worker_saving/methods.bl]}}
  retire_choice:  {stage: stages/retire_choice/retire_choice.bl,   methods: {all: [stages/retire_choice/methods.bl]}}
  retiree_saving: {stage: stages/retiree_saving/retiree_saving.bl, calibration: {all: [$fill]}, settings: {all: [settings/retiree_saving]}, methods: {all: [stages/retiree_saving/methods.bl]}}
  terminal:       {stage: stages/terminal/terminal.bl,             methods: {all: [stages/terminal/methods.bl]}, periods: [0, 0]}
