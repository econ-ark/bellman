stage: consumption_choice

methods:
  # The method block of consumption_choice_egm.bl opens the policy builder with
  # the endogenous grid method; the stage file states the maximization alone.
  # The setting grid names the exogenous grid of savings a_nxt by its kind, the
  # tag !Cartesian, with its order and bounds beside it, the settings n_a, a_min
  # and a_max of settings/housing-owner.yml.
  - on: policy
    method: !egm
    block: ../../methods/consumption_choice_egm.bl
    settings: {grid: !Cartesian, orders: {a_nxt: n_a}, bounds: {a_nxt: [a_min, a_max]}}

  # The derivative of the decision value in cash on hand is stated by the
  # marginal block of marginals_consumption_choice.bl on the decision value
  # builder.
  - on: cntn_to_dcsn
    method: !marginals
    block: ../../methods/marginals_consumption_choice.bl
