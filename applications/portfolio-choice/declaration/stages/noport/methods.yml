stage: noport

methods:
  - on: E_θ
    method: !gauss-hermite
    handler: cons-port:solve_nest_egm
    settings:
      n_nodes: [n_θ_nodes]

  - on: evaluate
    method: !Cartesian
    handler: cons-port:solve_nest_egm
    settings:
      orders:
        k_d: n_m
      bounds:
        k_d: [m_min, m_max]

  - on: dcsn_to_arvl

  - on: arvl_to_dcsn
    method: !deterministic

  - on: dcsn_to_cntn
    handler: cons-port:solve_nest_egm
    method: !monte-carlo
    settings:
      n_paths: n_sim
      seed: sim_seed
