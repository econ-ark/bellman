stage: renter_cons

# The method block of renter_cons_egm.bl opens the policy builder; the stage
# file states the maximization alone. The FUES solver inverts the Euler
# equation on the savings grid, adds the candidate consumption at the borrowing
# limit and the candidate segments at the tax thresholds, removes the
# candidates below the upper envelope with the routine the settings name, and
# holds the decision value, its derivative and the consumption policy on the
# cash grid by linear interpolation.
methods:
  - on: policy
    method: !egm
    block: ../../methods/renter_cons_egm.bl
    settings:
      orders: [a_nxt_points]
      bounds: [[a_nxt_min, a_nxt_max]]
      upper_envelope: upper_envelope
      ue_kwargs: ue_kwargs
      c_max: c_max
      n_constraint_points: n_constraint_points
      n_constraint_points_nxt: n_constraint_points_nxt
      tax_segments: tax_segments
    # The reference solutions of the paper's tables use value function
    # iteration on a dense grid in place of this entry:
    #   on: policy
    #   method: !vfi
    #   settings: {n_grid: N_arg_grid_vfi}

  # The derivative of the decision value in cash, the envelope condition, is
  # stated by the marginal block of marginals_renter_cons.bl.
  - on: cntn_to_dcsn
    method: !marginals
    block: ../../methods/marginals_renter_cons.bl

  - on: cntn_to_dcsn.value
    method: !Linear
    settings:
      orders: [w_points]
      bounds: [[w_min, w_max]]

  - on: cntn_to_dcsn.marginal
    method: !Linear
    settings:
      orders: [w_points]
      bounds: [[w_min, w_max]]

  - on: dcsn_to_cntn
