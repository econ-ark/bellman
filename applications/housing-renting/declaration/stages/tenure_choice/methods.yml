stage: tenure_choice

# The FUES solver compares the value of owning with the value of renting at
# every point of the asset grid, forms the arrival value as the product of the
# decision value with the transition matrix of the income chain, and holds the
# decision value and its derivative on the asset grid, reading the renter's
# value at the liquidated wealth by linear interpolation.
methods:
  - on: policy
    method: !discrete-choice

  - on: E_y
    method: !markov
    # The income chain is finite, so the expectation is the sum over the row of
    # Π at y_pre; the solver computes it as a matrix product.

  # The derivative of the decision value is stated by the marginal block of
  # marginals_tenure_choice.bl.
  - on: cntn_to_dcsn
    method: !marginals
    block: ../../methods/marginals_tenure_choice.bl

  - on: cntn_to_dcsn.choice_value
    method: !Linear
    settings:
      orders: [a_points]
      bounds: [[a_min, a_max]]

  - on: cntn_to_dcsn.choice_marginal
    method: !Linear
    settings:
      orders: [a_points]
      bounds: [[a_min, a_max]]

  - on: arvl_to_dcsn

  - on: dcsn_to_cntn
