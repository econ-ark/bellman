# Numerical settings of the housing model, from the configuration
# STD_RES_SETTINGS_4_TAXES of the replication code of Dobrescu and Shanker
# (2026). Grids, tolerances and the options of the upper envelope are settings;
# the housing sizes, the rental quantities and the tax schedule are parameters
# and are in calibration/housing-renting.yml.
settings:
  # Assets at the tenure and owner-housing stages, cash at the consumption
  # stages, and savings, the grid the endogenous grid method inverts on. The
  # paper reports runs with 500 to 10,000 points; 4,000 is the size of the
  # configuration.
  a_min: 1.0e-08
  a_max: 40.0
  a_points: 4000
  w_min: 1.0e-08
  w_max: 40.0
  w_points: 4000
  a_nxt_min: 1.0e-08
  a_nxt_max: 40.0
  a_nxt_points: 4000
  a_grid_multiplier: 1.5    # the endogenous-grid runs enlarge the asset and savings grids by this factor
  c_max: 50.0               # largest candidate consumption kept at the borrowing limit

  # The number of states of the discretised income chain. It is the size of the
  # discretisation that produced the transition matrix and the levels, seven
  # points for each of the two components of log income.
  y_points: 49

  # The upper envelope and the candidate points the endogenous grid method
  # supplies before it. FUES is the routine of the paper; DCEGM and CONSAV name
  # the two routines it is compared with. The fues_ settings preserve the
  # FUES overrides; the other two routines have no overrides.
  upper_envelope: FUES
  m_bar: 1.0001             # jump threshold of the scan
  lb: 10                    # look-back of the scan; fues_lb: 5 is the preserved FUES override
  n_constraint_points: 300      # candidate points on the segment at the borrowing limit
  n_constraint_points_nxt: 400  # candidate points on a segment where the policy jumps
  rfc_radius: 0.75
  rfc_n_iter: 20
  filter_a_jumps: true
  max_a_gradient: 1.01
  override_KT_conditions_at_jump: false
  grad_c_threshold: 0.95
  c_star_lb_pct: 5
  c_star_ub_pct: 0
  gradient_method: robust
  gradient_guard_distance: 2
  gradient_smooth_segments: true
  gradient_smoothing_window: 3
  fues_m_bar: 1.0001
  fues_lb: 5
  fues_include_intersections: false
  fues_return_intersections_separately: false
  fues_single_intersection: false
  fues_endog_mbar: false
  fues_padding_mbar: 0.0
  fues_no_double_jumps: true
  fues_disable_jump_checks: false
  fues_use_post_state_jump_test: true
  fues_left_turn_no_jump_strict: false
  fues_post_clean_double_jumps: false
  fues_detect_decreasing_policy: true
  fues_post_clean_passes: 1
  fues_jump_check_tol: 0
  fues_correct_jumps: false
  fues_min_segment_length: 2
  fues_eps_d: 1.0e-12
  fues_eps_sep: 1.0e-08
  fues_eps_fwd_back: 0.5
  fues_parallel_guard: 1.0e-10

  # The candidate segments at the tax thresholds: at each threshold the method
  # keeps the consumption values within thirty per cent of the candidate that
  # saves exactly to the threshold, one hundred points at each threshold. The
  # solver also moves each threshold to the nearest point of the savings grid
  # and recomputes the base values so that the schedule keeps its jumps; the
  # thresholds in calibration/housing-renting.yml are the model's, before that move.
  tax_enabled: true
  tax_c_lb_pct: 0.3
  tax_c_ub_pct: 0.3
  tax_n_points_per_node: 100

  # The dense grid of the value function iteration used as the reference
  # solution in the paper's tables.
  N_arg_grid_vfi: 500

  # The stopping rule of the infinite-horizon iteration, which the twenty-period
  # runs do not use.
  tol: 1.0e-06
  max_iter: 4000
