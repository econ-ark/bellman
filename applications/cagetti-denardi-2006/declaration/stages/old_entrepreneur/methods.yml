stage: old_entrepreneur

methods:
  # Appendix B: value function iteration on grids for assets and capital.
  - on: cntn_to_dcsn
    method: !vfi
    settings:
      orders: [n_a, n_k]
      bounds: [[a_min, a_max], [0, k_max]]
      tol: tol_v

  # Appendix B: the enforcement constraint is imposed as a largest enforceable
  # capital k̂(x), set first to k_max and reset, after each solution of the
  # value functions, to the largest capital at which repaying is preferred,
  # until it no longer changes. No method tag names this iteration.
  - on: policy.enforcement
    settings:
      initial: k_max
      tol: tol_k

  - on: arvl_to_dcsn
    method: !identity

  - on: dcsn_to_cntn
    method: !histogram
    settings:
      orders: [n_a]
      bounds: [[a_min, a_max]]
