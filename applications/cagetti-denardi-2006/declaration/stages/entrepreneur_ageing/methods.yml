stage: entrepreneur_ageing

methods:
  # The abilities take finitely many values, so the expectation over their new
  # draws is an exact sum.
  - on: E_y_n_θ_n
    method: !exact-markov

  # The demographic event has two outcomes with declared probabilities.
  - on: E_s
    method: !sum

  - on: arvl_to_dcsn
    method: !histogram
    settings:
      orders: [n_a]
      bounds: [[a_min, a_max]]

  - on: dcsn_to_cntn
    method: !deterministic
