# The recipe declaration/spec.cons-port.yml, consumption first, with the portfolio stage's methods taken from
# stages/port/methods.without_marginals.bl, which states no derivative of the portfolio value. Paths are written
# from the folder declaration/.
trellis: trellis.cons-port.yml
stages:
  cons: {stage: stages/cons/cons.bl, calibration: {all: [calibration/portfolio]}, settings: {all: [settings/cons_wide]}, methods: {all: [stages/cons/methods.bl]}}
  disc: {stage: stages/disc/disc.bl, calibration: {all: [calibration/portfolio]}, methods: {all: [stages/disc/methods.bl]}}
  port: {stage: stages/port/port.bl, calibration: {all: [calibration/portfolio]}, settings: {all: [settings/port_wide]}, methods: {all: [stages/port/methods.without_marginals.bl]}}
