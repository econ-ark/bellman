!trellis
name: reference_port_cons
# The fixed reference's beginning-of-period returns with the endogenous-grid method (its configuration
# beginning_egm): the portfolio stage as the reference solved it (stages/port/methods.reference.bl),
# consumption by the endogenous-grid method on the evenly spaced grids of settings/cons.yml
# (stages/cons/methods.reference.bl), discounting closing the period.
# Six equal periods; the one inter-period mapping stands for every adjacent pair.
periods:
  - stages:
      port: {stage: stages/port/port.bl, calibration: calibration/portfolio.yml,
             settings: settings/port.yml, methods: stages/port/methods.reference.bl}
      cons: {stage: stages/cons/cons.bl, calibration: calibration/portfolio.yml,
             settings: settings/cons.yml, methods: stages/cons/methods.reference.bl}
      disc: {stage: stages/disc/disc.bl, calibration: calibration/portfolio.yml,
             settings: {}, methods: stages/disc/methods.bl}
    connectors:
      - {w: m}
    repeat: 6
inter_connectors:
  - {disc.a: k}
