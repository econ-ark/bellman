stage: port
# The portfolio stage's methods. The stage file writes the maximization alone; the block file port_foc.bl,
# beside this file, opens the policy builder with the first-order condition of the share, solved for the
# share at each level of capital, and states the derivative of the decision value. Gauss-Hermite quadrature
# of the declared distribution stands at the expectations; the value is represented on the grid of capital
# the settings name. The function share_search of the application's tool,
# applications/cons-port/code/cons_port_tool.py, realizes the opened builder:
# it chooses the share by a search over the declared objective at the n_ς shares the
# settings name, and integrates the line envelope at the chosen share for the marginal value. The forward law is
# drawn by Monte Carlo, n_sim paths from the seed the settings name.
methods:
  - on: policy
    method: !time-iteration
    block: port_foc.bl
    handler: cons-port:share_search
  - on: cntn_to_dcsn
    method: !marginals
    block: port_foc.bl
  - on: E_Ψ_θ
    method: !gauss-hermite
    handler: cons-port:gauss_hermite
    settings: {n_nodes: [n_Ψ_nodes, n_θ_nodes]}
  - on: evaluate
    method: !Linear
    settings: {orders: {k: n_k}, bounds: {k: [k_min, k_max]}}
  - on: dcsn_to_cntn
    method: !monte-carlo
    settings: {n_paths: n_sim, seed: sim_seed}
