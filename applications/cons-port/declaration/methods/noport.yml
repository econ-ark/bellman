stage: noport
# The methods of the stage without a portfolio choice: Gauss-Hermite quadrature of the declared distribution of income
# at the expectation; the marginal block of noport_envelope.bl, beside this file, which states the derivative of the
# decision value; the value represented at the decision builder's Evaluation, cntn_to_dcsn.evaluate.value, by the
# basis !Linear on the grid of capital k that the setting grid names by its kind, !Cartesian, with its order and
# bounds, the settings n_k, k_min and k_max, beside it; and the forward law drawn by Monte Carlo, n_sim paths from the
# seed the settings name. In one dimension the rule of the fixed reference and the rule of the declared distribution
# agree, so one handler serves both.
methods:
  - on: E_θ
    method: !gauss-hermite
    handler: cons-port:gauss_hermite
    settings: {n_nodes: [n_θ_nodes]}
  - on: cntn_to_dcsn
    method: !marginals
    block: noport_envelope.bl
  - on: cntn_to_dcsn.evaluate.value
    method: !Linear
    settings: {grid: !Cartesian, orders: {k: n_k}, bounds: {k: [k_min, k_max]}}
  - on: dcsn_to_cntn
    method: !monte-carlo
    settings: {n_paths: n_sim, seed: sim_seed}
