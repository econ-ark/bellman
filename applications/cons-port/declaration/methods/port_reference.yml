stage: port
# The portfolio stage as the fixed reference solved it: the lines of port.yml with the handlers by which the
# reference integrated the shocks, the earlier library's Gauss-Hermite rule, which added the mean of the logarithms
# twice, and took the marginal value, the difference quotient of the values. Used by the reference configurations alone.
methods:
  - on: policy
    method: !time-iteration
    block: port_foc.bl
    handler: cons-port:share_search_reference
  - on: cntn_to_dcsn
    method: !marginals
    block: port_foc.bl
  - on: E_Ψ_θ
    method: !gauss-hermite
    handler: cons-port:gauss_hermite_reference
    settings: {n_nodes: [n_Ψ_nodes, n_θ_nodes]}
  - on: evaluate
    method: !Linear
    settings: {orders: {k: n_k}, bounds: {k: [k_min, k_max]}}
  - on: dcsn_to_cntn
    method: !monte-carlo
    settings: {n_paths: n_sim, seed: sim_seed}
