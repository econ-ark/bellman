stage: cons
# The consumption stage's methods under value function iteration, on the stage file
# declaration/stages/cons/cons.bl, which writes the maximization alone: a
# grid search over candidate consumption levels on the backward decision builder, realized by the function
# consumption_search of cons_port_tool.py, and the value represented on the grid of resources the settings name.
# No block is bound: the search reads no marginal value of the continuation and takes the marginal value of the
# decision as the difference quotient of the values.
methods:
  - on: cntn_to_dcsn
    method: !vfi
    handler: cons-port:consumption_search
  - on: evaluate
    method: !Cartesian
    settings: {orders: {m: n_m}, bounds: {m: [m_min, m_max]}}
