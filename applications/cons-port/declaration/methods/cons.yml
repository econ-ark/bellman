stage: cons
# The consumption stage's methods. The stage file writes the maximization alone; the block file cons_egm.bl,
# beside this file, opens the policy builder with the endogenous-grid method and states the derivative of the
# decision value, the envelope condition. The function egm of the application's tool,
# applications/cons-port/code/cons_port_tool.py, realizes the method on the exogenous grid of savings a that its
# setting grid names: the kind of the grid is the tag on the value of grid, !Cartesian, and its order and bounds, the
# settings n_a, a_min and a_max, stand beside it. The value and its stated derivative are represented at the decision
# builder's Evaluation by the basis !Linear, read between its nodes by linear interpolation, on the grid of
# resources m that the setting grid names in the same way; the entry names that place by the derivative,
# cntn_to_dcsn.evaluate.marginal.
methods:
  - on: policy
    method: !egm
    block: cons_egm.bl
    handler: cons-port:egm
    settings: {grid: !Cartesian, orders: {a: n_a}, bounds: {a: [a_min, a_max]}}
  - on: cntn_to_dcsn
    method: !marginals
    block: cons_egm.bl
  - on: cntn_to_dcsn.evaluate.marginal
    method: !Linear
    settings: {grid: !Cartesian, orders: {m: n_m}, bounds: {m: [m_min, m_max]}}



    ## Issues for aAS 24 oct 2026: 1) why evaluate was envelope, 2) how can i declare different methods ie polynomial spline etc. something on the the interpolated V ( should be fully flexible as to how the dV is created if at all). 
    # Answer (26 October 2026, AMD-MB-001 D4 and D6): the derivative line stands at the decision builder's Evaluation because the value's representation is bound there, so the envelope line and the interpolation method are two properties of one represented value. A representation of the derivative of its own, a polynomial spline or any other representation method, is bound on the line's id, as the entry on cntn_to_dcsn.envelope above binds !Cartesian, and where no line is bound the derivative of the value's representation serves.
    # Answer (31 October 2026, AMD-MB-002): the author now writes the place of a representation, the decision builder's Evaluation, by what it evaluates: cntn_to_dcsn.evaluate.marginal for the stated derivative, as the entry above writes it in place of the line's id cntn_to_dcsn.envelope, and cntn_to_dcsn.evaluate.value for the value. The value and its stated derivative share that one Evaluation, which holds one representation method, so two entries there name the same method; a representation of the derivative apart from the value's is not admitted. This replaces the last sentence of the answer of 26 October.
    # Answer (1 November 2026, AMD-MB-003), on the second question: a representation names its basis as the method, !Linear for piecewise linear interpolation or !pchip for the shape-preserving cubic, and its grid as the tagged setting, grid: !Cartesian under settings with orders and bounds beside it, as the entry above writes it; !Cartesian, which the entry wrote as its method before, is a kind of grid and no longer a method. Another basis, such as a cubic spline, would be a further method of the table on the same grid setting; its name is among the decisions that wait for AAS (D3 of AMD-MB-003).
