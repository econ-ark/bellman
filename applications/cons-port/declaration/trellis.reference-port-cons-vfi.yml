!trellis
name: reference_port_cons_vfi
# The fixed reference's beginning-of-period returns with a grid search over consumption (its configuration
# beginning_vfi): the portfolio stage as the reference solved it (stages/port/methods.reference.bl), and
# consumption searched on the capital grid the reference borrowed from the portfolio methods file
# (settings/cons_vfi_reference.yml), evenly spaced, with stages/cons/methods.vfi_reference.bl. Compared in
# structure only.
# Six equal periods; the one inter-period mapping stands for every adjacent pair.
periods:
  - stages:
      port: {stage: stages/port/port.bl, calibration: calibration/portfolio.yml,
             settings: settings/port.yml, methods: stages/port/methods.reference.bl}
      cons: {stage: stages/cons/cons.bl, calibration: calibration/portfolio.yml,
             settings: settings/cons_vfi_reference.yml, methods: stages/cons/methods.vfi_reference.bl}
      disc: {stage: stages/disc/disc.bl, calibration: calibration/portfolio.yml,
             settings: {}, methods: stages/disc/methods.bl}
    connectors:
      - {w: m}
    repeat: 6
inter_connectors:
  - {disc.a: k}
