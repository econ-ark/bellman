!trellis
name: reference_port_cons_vfi
# The fixed reference's beginning-of-period returns with a grid search over consumption (its configuration
# beginning_vfi): the portfolio stage as the reference solved it, and consumption searched on the capital grid
# the reference borrowed from the portfolio methods file (settings/cons_vfi_reference.yml). Compared in
# structure only.
# Six equal periods; the one inter-period mapping stands for every adjacent pair.
periods:
  - stages:
      port: {stage: stages/port/port.bl, calibration: calibration/portfolio.yml,
             settings: settings/port.yml, methods: methods/port_reference.yml}
      cons: {stage: stages/cons/cons.bl, calibration: calibration/portfolio.yml,
             settings: settings/cons_vfi_reference.yml, methods: methods/cons_vfi.yml}
      disc: {stage: stages/disc/disc.bl, calibration: calibration/portfolio.yml,
             settings: {}, methods: methods/disc.yml}
    connectors:
      - {w: m}
    repeat: 6
inter_connectors:
  - {disc.a: k}
