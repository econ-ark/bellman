# Stage this methodization targets
stage: noport_stage

# Node-to-method-and-handler bindings
methods:
  - on: E_θ
    method: !gauss-hermite
    handler: cons-port:solve_nest_egm
    settings:
      n_nodes: n_θ_nodes

  - on: evaluate
    method: !Cartesian
    handler: cons-port:solve_nest_egm
    settings:
      orders: [n_m]
      bounds: [[m_min, m_max]]

  - on: dcsn_to_arvl

  - on: arvl_to_dcsn

  - on: dcsn_to_cntn
    handler: cons-port:solve_nest_egm

  - on: arvl_to_dcsn_builder
    method: !deterministic

  - on: dcsn_to_cntn_builder
    method: !monte-carlo
    settings:
      n_paths: n_sim
      seed: sim_seed
