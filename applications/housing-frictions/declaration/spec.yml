# The recipe of the housing model with adjustment frictions (Dobrescu and
# Shanker 2024, Application 2): the trellis file and each stage's file, by
# their paths from this folder, and for each stage and each kind the ordered
# sources; `$fill` and the three methods slots are bound by keyword of
# `load_recipe`. The application writes no settings file, so no settings list
# is written. Each stage's methods file binds the marginal blocks that state
# the derivatives of its values, and each methods list holds it and the stage's
# own methods slot, `$house_choice_method`, `$keeper_method` or
# `$adjuster_method`, so that a method choice, when one is given, reaches
# one stage.
# The terminal stage declares no parameter and reads no setting; its methods
# file binds the marginal block of its two derivatives. It is active in the
# terminal period alone, `periods: [0, 0]`, and trellis.yml writes it into
# that period's own entry.
trellis: trellis.yml
stages:
  house_choice:    {stage: stages/house_choice/house_choice.bl,       calibration: {all: [calibration/housing_frictions, $fill]}, methods: {all: [stages/house_choice/methods, $house_choice_method]}}
  keeper_saving:   {stage: stages/keeper_saving/keeper_saving.bl,     calibration: {all: [calibration/housing_frictions, $fill]}, methods: {all: [stages/keeper_saving/methods, $keeper_method]}}
  adjuster_saving: {stage: stages/adjuster_saving/adjuster_saving.bl, calibration: {all: [calibration/housing_frictions, $fill]}, methods: {all: [stages/adjuster_saving/methods, $adjuster_method]}}
  terminal:        {stage: stages/terminal/terminal.bl,               methods: {all: [stages/terminal/methods]}, periods: [0, 0]}
