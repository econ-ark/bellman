# Numerical settings of the within-life model, the values of the legacy
# registry. Nothing here is part of the model: the domains and laws are in the
# stage file and the parameter values under calibration/.

settings:
  # Grid of the wealth a, in thousands of dollars: from the borrowing limit,
  # zero, to well above the largest lifetime earnings of any decile.
  n_a: 300
  a_min: 0.0
  a_max: 500.0
  # grid_phi above one places more points near a_min.
  grid_phi: 2.0

  # Tolerance and the largest number of iterations of the endogenous grid step.
  tol: 1.0e-08
  max_iter: 500
