# The recipe of the within-life model of Benhabib, Bisin and Luo (2019): the
# trellis file and each stage's file, by their paths from this folder, and for
# each stage and each kind the ordered sources; `$fill` is bound by keyword of
# `load_recipe`. The methods of a stage are the additions its methods list
# names, each a `.bl` file read with the stage file at every occurrence:
# `stages/benhabib_bellman/methods.bl` for the within-life stage and
# `stages/bequest/methods.bl` for the bequest. A second addition of the
# within-life stage, `stages/benhabib_bellman/methods.bellman_method.bl`, which
# types the policy builder's Evaluation and its node InvEuler, is named by no
# list; an author who names it after the first in the list binds both.
#
# periods[0] holds the bequest. The within-life stage in periods[1] to
# periods[36] takes in the age and reads the fixed wage table for the age
# one year younger. The bequest keeps the terminal age supplied by the user.
trellis: trellis.yml
stages:
  benhabib_bellman:
    stage: stages/benhabib_bellman/benhabib_bellman.bl
    calibration: {all: [calibration/main, calibration/wage, $fill]}
    settings: {all: [settings/default, $fill]}
    methods:  {all: [stages/benhabib_bellman/methods.bl]}
    periods: [1, 36]
  bequest: {stage: stages/bequest/bequest.bl, calibration: {all: [calibration/main, $fill]}, methods: {all: [stages/bequest/methods.bl]}, periods: [0, 0]}
