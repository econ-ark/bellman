stage: retiree_saving

methods:
  # The derivative of the decision value in resources and the derivatives of the
  # arrival value are stated by the two marginal blocks of
  # marginals_retiree_saving.bl, one for each value builder.
  - on: cntn_to_dcsn
    method: !marginals
    block: ../../methods/marginals_retiree_saving.bl

  - on: dcsn_to_arvl
    method: !marginals
    block: ../../methods/marginals_retiree_saving.bl
