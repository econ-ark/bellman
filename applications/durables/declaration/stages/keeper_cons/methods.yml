stage: keeper_cons

# Numerical choices for keeper_cons.bl, taken from the replication code of
# Dobrescu and Shanker (2026), Application 2. The setting names on the right of
# each entry are the keys of settings/durables.yml; their values are supplied
# by configuration, after these methods are attached. The grids of the three
# tabulated outputs are keyed by the decision coordinates w_d and h_d.

methods:
  # The method block of keeper_cons_egm.bl opens the policy builder, whose stage
  # file states the maximization alone. The endogenous grid method realizes the
  # implicit statement policy.cons_choice: for each income state and housing
  # point it inverts the Euler equation on a grid of savings, adds the
  # constrained segment at the lowest saving, and selects among the candidates
  # by value with the fast upper envelope scan. The setting grid names the
  # exogenous grid of savings by its kind, !Cartesian, with its order and
  # bounds beside it; the routine of the replication code reads the order and
  # the bounds of this grid by its own keys savings_orders and savings_bounds,
  # and its spacing, which the setting grid does not state, by
  # savings_spacing; these keys stand below until it reads the setting grid.
  - on: policy
    method: !egm
    block: ../../methods/keeper_cons_egm.bl
    handler: fues-durables:make_keeper_ops
    settings:
      grid: !Cartesian
      orders: {a_nxt_kp: n_a}
      bounds: {a_nxt_kp: [a_min, a_max]}
      savings_orders: [n_a]
      savings_bounds: [[a_min, a_max]]
      savings_spacing: grid_phi
      savings_floor: b
      upper_envelope: keeper_upper_envelope
      jump_threshold: m_bar
      lookback: fues_lb
      eps_d: fues_eps_d
      eps_sep: fues_eps_sep
      eps_fwd_back: fues_eps_fwd_back
      parallel_guard: fues_parallel_guard
      include_intersections: keeper_include_intersections
      no_double_jumps: keeper_no_double_jumps
      single_intersection: keeper_single_intersection
      disable_jump_checks: keeper_disable_jump_checks

  # The derivatives of the decision value in cash on hand and in housing are
  # stated by the marginal block of marginals_keeper_cons.bl on the decision
  # value builder.
  - on: cntn_to_dcsn
    method: !marginals
    block: ../../methods/marginals_keeper_cons.bl

  # The value the backward block writes, on the line value, and the two
  # derivatives of the value the marginal block states, on the lines
  # marginal_cash and marginal_housing, are each tabulated on a grid of cash on
  # hand and housing, one table per income state, and read by linear
  # interpolation in cash on hand, the basis !Linear, at the decision builder's
  # Evaluation, on the grid that the setting grid names by its kind,
  # !Cartesian, with its order and bounds beside it: the first entry names the
  # value there, cntn_to_dcsn.evaluate.value, and the second the two stated
  # derivatives, cntn_to_dcsn.evaluate.marginal.
  - on: cntn_to_dcsn.evaluate.value
    method: !Linear
    handler: dcsmm:interp_as
    settings:
      grid: !Cartesian
      orders: {w_d: n_a, h_d: n_h}
      bounds: {w_d: [a_min, a_max], h_d: [h_min, h_max]}
      extrapolate: extrap_policy
      clamp_factor: clamp_max_factor

  - on: cntn_to_dcsn.evaluate.marginal
    method: !Linear
    handler: dcsmm:interp_as
    settings:
      grid: !Cartesian
      orders: {w_d: n_a, h_d: n_h}
      bounds: {w_d: [a_min, a_max], h_d: [h_min, h_max]}
      extrapolate: extrap_policy
      clamp_factor: clamp_max_factor
