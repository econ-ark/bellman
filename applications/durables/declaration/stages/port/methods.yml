stage: port
# The portfolio stage's methods: Gauss-Hermite quadrature of the declared distribution at the expectations, a grid
# search over the share at the policy block, the derivative of the decision value from the derivative line
# marginal of marginals_port.bl at the chosen share; the value represented on the grid of capital the
# settings name.
methods:
  - on: E_Ψ_θ
    method: !gauss-hermite
    handler: cons-port:gauss_hermite
    settings: {n_nodes: [n_Ψ_nodes, n_θ_nodes]}
  - on: cntn_to_dcsn
    method: !marginals
    block: ../../methods/marginals_port.bl
  - on: cntn_to_dcsn
    method: !vfi
    handler: cons-port:share_search
    settings: {orders: {k_d: n_k}, bounds: {k_d: [k_min, k_max]}}
  - on: evaluate
    method: !Linear
    settings: {orders: {k_d: n_k}, bounds: {k_d: [k_min, k_max]}}
