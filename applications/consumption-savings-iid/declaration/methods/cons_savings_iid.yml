stage: cons_savings_iid
# The consumption-savings stage's methods. The stage file writes the values and
# the maximization alone; the block file cons_savings_iid_egm.bl, beside this
# file, opens the policy builder with the endogenous grid method, and the block
# file marginals.bl states the derivatives of the decision value and the
# arrival value, one marginal block for each value builder. The endogenous grid
# method names its exogenous grid of savings a by the setting grid, whose kind
# is the tag !Cartesian, with its order and bounds beside it, the settings
# n_a, a_min and a_max of settings/cons_savings_iid.yml.
methods:
  - on: policy
    method: !egm
    block: cons_savings_iid_egm.bl
    settings: {grid: !Cartesian, orders: {a: n_a}, bounds: {a: [a_min, a_max]}}
  - on: cntn_to_dcsn
    method: !marginals
    block: marginals.bl
  - on: dcsn_to_arvl
    method: !marginals
    block: marginals.bl
